name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - ".gitignore"
      - "README.md"
      - "commitlint.config.cjs"
      - "docs/**"
      - "test/**"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write
  issues: read
  pull-requests: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    env:
      CODEX_CLIPROXY_SKIP_TESTS: "1"
      HAS_RELEASE_PAT: ${{ secrets.RELEASE_PAT != '' }}
    environment:
      name: production
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          # 用 RELEASE_PAT 推送 release 提交与 tag，tag 事件才能触发 GitHub Release workflow；
          # secret 缺失时回退 GITHUB_TOKEN，并在 npm 发布成功后主动 dispatch Release。
          token: ${{ secrets.RELEASE_PAT || github.token }}
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.5"
      - run: bun ci
      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Create release commit and tag
        id: version
        run: |
          PREVIOUS_HEAD="$(git rev-parse HEAD)"
          bun run release:version -- --yes
          if [ "$PREVIOUS_HEAD" = "$(git rev-parse HEAD)" ]; then
            echo "未生成新版本，跳过 GitHub Release 自动触发。"
            exit 0
          fi
          TAG="v$(jq -r '.version' lerna.json)"
          if [ "$(git rev-parse --verify "refs/tags/${TAG}^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::版本标签 ${TAG} 未指向本次发布提交，请检查版本步骤。"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_AUTH: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to npm
        run: bun run release -- --yes
      - name: Trigger GitHub Release without PAT
        if: env.HAS_RELEASE_PAT == 'false' && steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run github-release.yml --ref main -f tag="$RELEASE_TAG"
