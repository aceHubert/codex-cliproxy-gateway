name: Release check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Linux runner 无法执行依赖 macOS/本机状态的安装类用例；
      # 与 Deploy 的 preversion 保持一致，提前拦截 typecheck 与打包错误。
      CODEX_CLIPROXY_SKIP_TESTS: "1"
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.5"
      - run: bun ci
      - run: bun run release:check
