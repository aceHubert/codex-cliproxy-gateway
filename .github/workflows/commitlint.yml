name: Check Commit spec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22.22.0"
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.5"
      - run: bun ci --ignore-scripts
      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
      - name: Check pushed commits
        if: github.event_name == 'push'
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
          else
            bunx commitlint --last --verbose
          fi
      - name: Check latest commit
        if: github.event_name == 'workflow_dispatch'
        run: bunx commitlint --last --verbose
